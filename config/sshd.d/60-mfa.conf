# /etc/ssh/sshd_config.d/60-mfa.conf
#
# Wire sshd to the SSH MFA plugin. Place this on every TARGET host you want to
# protect. Requires the mfa-sshd package installed and the watcher running.
#
# How pubkey auth is gated:
#   * sshd first tries the user's normal authorized_keys (if any).
#   * For any key not statically authorised, sshd calls AuthorizedKeysCommand.
#     Our plugin checks the local store: a live (username, pubkey) approval
#     emits the key and grants access; otherwise it denies and prints, to the
#     connecting user, the command/URL to authenticate.
#
# NOTE: AuthorizedKeysCommand runs as the unprivileged "sshd" user, so the store
# file (SQLite) must be world-readable, e.g. /var/lib/ssh-mfa/approvals.db 0644.

# Run the plugin for every pubkey attempt. %u user, %t key type, %k base64 key,
# %c comment. Output goes to the sshd log; user-facing text is on stderr.
AuthorizedKeysCommand /usr/local/bin/mfa-sshd authorized-keys %u %t %k %c
AuthorizedKeysCommandUser sshd

# Optional: force MFA-only accounts to have NO static keys at all, so every
# login must pass through MFA. Uncomment to enforce:
# AuthorizedKeysFile /dev/null
