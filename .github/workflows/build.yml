name: Build auth-server image

# Auto-builds the auth server as a container and pushes it to GHCR.
# Runs on every push to main (edge image) and on tags (release image).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Don't let concurrent runs of the same workflow clobber each other.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}/auth-server

permissions:
  contents: read
  packages: write

jobs:
  test:
    # Verify the code before building/pushing an image.
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages under test
        run: |
          pip install ./mfa_store ./mfa_auth ./mfa_sshd ./mfa_cli
      - name: Run end-to-end + HTTP suites
        run: |
          PYTHONPATH=mfa_store:mfa_auth:mfa_sshd:mfa_cli python3 tests/test_e2e.py
          PYTHONPATH=mfa_store:mfa_auth:mfa_sshd:mfa_cli python3 tests/test_http.py

  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: meta
        run: |
          tags="${IMAGE}:edge"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
